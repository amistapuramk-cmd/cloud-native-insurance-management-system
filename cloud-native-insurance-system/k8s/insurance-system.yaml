apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
      - name: api-gateway
        image: insurance/api-gateway:1.0
        ports: [{ containerPort: 3000 }]
        env:
        - { name: PORT, value: "3000" }
        - { name: CUSTOMER_SERVICE_URL, value: "http://customer-service" }
        - { name: POLICY_SERVICE_URL, value: "http://policy-service" }
        - { name: CLAIM_SERVICE_URL, value: "http://claim-service" }
        readinessProbe:
          httpGet: { path: /health, port: 3000 }
          initialDelaySeconds: 3
        livenessProbe:
          httpGet: { path: /health, port: 3000 }
          initialDelaySeconds: 10
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports:
  - { port: 80, targetPort: 3000 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
